<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>Prueba POST - Confesionario</title>


<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  min-height: 100vh;

  padding: 30px 20px;

  background:
    radial-gradient(
      circle at top,
      #482949 0%,
      #281628 45%,
      #100b11 100%
    );

  color: white;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  text-align: center;

}


.contenedor {

  width: 100%;

  max-width: 650px;

  margin: auto;

}


h1 {

  font-size: 38px;

  margin-bottom: 10px;

}


.descripcion {

  opacity: .8;

  line-height: 1.5;

  margin-bottom: 30px;

}


button {

  display: block;

  width: 100%;

  margin: 14px 0;

  padding: 20px;

  border: 0;

  border-radius: 18px;

  background: #f2d58b;

  color: #251625;

  font-size: 20px;

  font-weight: 900;

  cursor: pointer;

}


button:disabled {

  opacity: .4;

}


.tarjeta {

  margin-top: 30px;

  padding: 25px;

  border-radius: 22px;

  background:
    rgba(
      255,
      255,
      255,
      .08
    );

  border:
    1px solid
    rgba(
      255,
      255,
      255,
      .15
    );

}


#estado {

  font-size: 19px;

  line-height: 1.5;

}


.exito {

  color: #b7ffb7;

}


.error {

  color: #ffb5b5;

}


.pequeno {

  margin-top: 25px;

  opacity: .65;

  font-size: 14px;

}

</style>

</head>


<body>


<div class="contenedor">

  <div style="font-size:70px;">
    🧪
  </div>


  <h1>
    Prueba de tamaño POST
  </h1>


  <p class="descripcion">

    Esta página no graba videos
    ni guarda nada en Drive.

    <br><br>

    Solo comprobaremos qué tamaño
    consigue llegar desde GitHub Pages
    hasta Apps Script.

  </p>


  <button onclick="probar(100)">
    PROBAR 100 KB
  </button>


  <button onclick="probar(500)">
    PROBAR 500 KB
  </button>


  <button onclick="probar(1024)">
    PROBAR 1 MB
  </button>


  <button onclick="probar(2048)">
    PROBAR 2 MB
  </button>


  <button onclick="probar(4096)">
    PROBAR 4 MB
  </button>


  <div class="tarjeta">

    <div id="estado">
      Esperando prueba...
    </div>

  </div>


  <p class="pequeno">

    Después de cada prueba revisa:

    <br>

    Apps Script → Ejecuciones

  </p>

</div>


<!--
  El POST se carga en este iframe
  para que el iPad no abandone
  la página de diagnóstico.
-->

<iframe
  id="resultadoPost"
  name="resultadoPost"
  style="display:none;"
></iframe>


<form
  id="formPrueba"
  method="POST"
  target="resultadoPost"
  style="display:none;"
>

  <input
    type="hidden"
    id="campoPrueba"
    name="prueba"
  >

  <input
    type="hidden"
    id="campoCarga"
    name="carga"
  >

</form>


<script>

const API_URL =
  'https://script.google.com/macros/s/AKfycbzGZxguZB-diYDtcI1q0Vsx0aTgd42Lvi31JQnr0o_42ckNY8qagSaOMrIsxmTQ4IJdug/exec';


const formulario =
  document.getElementById(
    'formPrueba'
  );


const campoPrueba =
  document.getElementById(
    'campoPrueba'
  );


const campoCarga =
  document.getElementById(
    'campoCarga'
  );


const estado =
  document.getElementById(
    'estado'
  );


const iframe =
  document.getElementById(
    'resultadoPost'
  );


formulario.action =
  API_URL;


/* ============================================================
   CREAR CADENA
   ============================================================ */

function crearCarga(
  cantidadCaracteres
) {

  /*
    Creamos bloques para no depender
    de String.repeat() con una cadena
    gigantesca de una sola vez.
  */

  const bloque =
    'A'.repeat(
      1024
    );


  const bloques = [];


  const cantidadBloques =
    Math.floor(
      cantidadCaracteres /
      1024
    );


  for (
    let i = 0;
    i < cantidadBloques;
    i++
  ) {

    bloques.push(
      bloque
    );

  }


  const restante =
    cantidadCaracteres %
    1024;


  if (restante > 0) {

    bloques.push(
      'A'.repeat(
        restante
      )
    );

  }


  return bloques.join('');

}


/* ============================================================
   REALIZAR PRUEBA
   ============================================================ */

function probar(
  kb
) {

  estado.className = '';

  estado.innerHTML =
    '⏳ Preparando ' +
    kb +
    ' KB...';


  /*
    Dejamos que Safari pinte primero
    el mensaje antes de generar
    la cadena.
  */

  setTimeout(
    function() {

      try {

        const caracteres =
          kb * 1024;


        const carga =
          crearCarga(
            caracteres
          );


        campoPrueba.value =
          kb + ' KB';


        campoCarga.value =
          carga;


        estado.innerHTML =
          '📤 Enviando ' +
          kb +
          ' KB a Apps Script...';


        formulario.submit();


        /*
          Esto NO significa que Apps Script
          lo haya recibido.

          Solo significa que Safari ejecutó
          submit().
        */

        setTimeout(
          function() {

            estado.innerHTML =
              '🔎 POST enviado desde Safari.<br><br>' +
              'Ahora revisa <b>Apps Script → Ejecuciones</b>.<br><br>' +
              'Busca un <b>doPost</b> nuevo correspondiente a ' +
              '<b>' +
              kb +
              ' KB</b>.';

          },
          1200
        );


      } catch(error) {

        estado.className =
          'error';


        estado.textContent =
          '❌ ' +
          error.message;

      }

    },
    100
  );

}


/* ============================================================
   IFRAME
   ============================================================ */

iframe.addEventListener(
  'load',
  function() {

    /*
      No intentamos leer el contenido
      porque está en otro dominio.

      El evento load solamente nos
      indica que hubo una navegación
      del iframe.
    */

    console.log(
      'El iframe terminó una navegación.'
    );

  }
);

</script>


</body>

</html>
